;==================================================================
; 跨境电商 · 防泄漏 / 防关联 订阅转换模板 (subconverter / OpenClash)
; 仓库：https://github.com/abxian/Custom_OpenClash_Rules
; 规则：https://github.com/abxian/stash-override  (rule/*.list)
;
; 设计原则：
;   1) 全覆盖不漏 —— 平台域名清单 + GEOSITE 双保险；长尾平台合并为聚合清单
;      (Ecommerce_All / Payment_All / Social_All / AI_All / Stream_All)，
;      既覆盖全部域名，又把 ruleset 条目控制在 subconverter 上限(64)以内
;   2) 顺序精确 —— 子品牌必须排在母公司之前：
;      WhatsApp / Instagram / Threads / Messenger  →  Facebook
;      YouTube                                     →  Google
;      否则会被母公司规则抢先命中，导致分错节点
;   3) 兜底走代理 —— geolocation-!cn 抓走全部境外域名，FINAL 也走代理，
;      杜绝"漏网直连"暴露真实 IP
;   4) 不含广告拦截 —— 便于广告投流
;   5) 不含 IP-ASN 规则 —— IP-ASN 需要 ASN.mmdb，缺库时内核会尝试下载，
;      未连上代理前必然超时并导致「Parse config error」启动失败。
;      故 Facebook/Telegram 使用 *_NoASN 版清单；Telegram 的 IP 段
;      由 GEOIP,telegram 覆盖（走 GeoIP MMDB，无需额外数据库）
;
; 覆盖平台：
;   电商 Temu/Shein/Amazon/eBay/Etsy/AliExpress/Shopify/Lazada/Shopee/
;        MercadoLibre/Walmart/Rakuten/BestBuy/Alibaba/Target/Costco/Wish/Coupang
;   支付 PayPal/Stripe/Payoneer/Airwallex/Wise
;   社媒 Facebook/Instagram/Threads/Messenger/WhatsApp/Twitter(X)/TikTok/
;        Telegram/Snapchat/Reddit/Pinterest/LinkedIn/Discord/Line/Kakao/
;        VK/Quora/Tumblr/Signal
;   AI   OpenAI/Claude/Gemini/Copilot 等
;==================================================================

[custom]
enable_rule_generator=true
overwrite_original_rules=true

;----------------------------------------------------------------
; 一、本地 / 局域网直连
;----------------------------------------------------------------
ruleset=全球直连,[]GEOSITE,private
ruleset=全球直连,[]GEOIP,private,no-resolve

;----------------------------------------------------------------
; 二、防 WebRTC 泄漏（拦截 STUN，阻止探测真实公网 IP）
;----------------------------------------------------------------
ruleset=WebRTC,[]DOMAIN-KEYWORD,stun
ruleset=WebRTC,[]DOMAIN-SUFFIX,stun.l.google.com

;----------------------------------------------------------------
; 二之二、通用人机验证端点（必须最优先，且不依赖远程清单更新时机）
;   challenges.cloudflare.com 是全站共用的 Turnstile 端点，
;   若被某个平台清单收录会把全站验证流量都拽走，故在此显式接管
;   注：arkoselabs 不在此前置——OpenAI 有专属子域需跟随 AI 组，
;       通用 arkoselabs 由后面的 Verify_All 清单接管
;----------------------------------------------------------------
ruleset=验证服务,[]DOMAIN-SUFFIX,challenges.cloudflare.com
ruleset=验证服务,[]DOMAIN-SUFFIX,hcaptcha.com

;----------------------------------------------------------------
; 三、Meta 系（顺序关键：子品牌必须在 Facebook 之前）
;----------------------------------------------------------------
ruleset=WhatsApp,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/WhatsApp.list,86400
ruleset=WhatsApp,[]GEOSITE,whatsapp

ruleset=Instagram,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Instagram.list,86400
ruleset=Instagram,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Threads.list,86400
ruleset=Instagram,[]GEOSITE,instagram
ruleset=Instagram,[]GEOSITE,threads

ruleset=Facebook,[]GEOSITE,messenger
ruleset=Facebook,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Facebook_NoASN.list,86400
ruleset=Facebook,[]GEOSITE,facebook

;----------------------------------------------------------------
; 四、其它主流社媒（各自独立组，便于每账号钉固定 IP）
;----------------------------------------------------------------
ruleset=Twitter,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Twitter.list,86400
ruleset=Twitter,[]GEOSITE,twitter

ruleset=TikTok,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/Custom_OpenClash_Rules@633657074d243f6869c1c3978eb64b2305dfe097/rule/openclash/TikTok.list,86400
ruleset=TikTok,[]GEOSITE,tiktok

ruleset=Telegram,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Telegram_NoASN.list,86400
ruleset=Telegram,[]GEOSITE,telegram
ruleset=Telegram,[]GEOIP,telegram,no-resolve

; 社交媒体聚合（Snapchat/Reddit/Pinterest/LinkedIn/Discord/Line/Kakao/VK/Quora/Tumblr）
ruleset=社交媒体,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Social_All.list,86400
ruleset=社交媒体,[]GEOSITE,signal
ruleset=社交媒体,[]GEOSITE,category-social-media-!cn
ruleset=社交媒体,[]GEOSITE,category-communication

;----------------------------------------------------------------
; 五、支付 / 收款（资金侧，建议独立固定 IP）
;   必须排在 AI 服务之前：OpenAI 等清单内含 stripe.com 计费域名，
;   若 AI 在前会把 stripe 抢走，导致支付流量走错节点
;----------------------------------------------------------------
ruleset=支付平台,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/Custom_OpenClash_Rules@633657074d243f6869c1c3978eb64b2305dfe097/rule/openclash/Payment_All.list,86400
ruleset=支付平台,[]GEOSITE,paypal
ruleset=支付平台,[]GEOSITE,stripe
ruleset=支付平台,[]GEOSITE,wise

;----------------------------------------------------------------
; 六、AI 服务
;----------------------------------------------------------------
ruleset=AI服务,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/AI_Service.list,86400
ruleset=AI服务,[]GEOSITE,openai
ruleset=AI服务,[]GEOSITE,anthropic
ruleset=AI服务,[]GEOSITE,google-gemini
ruleset=AI服务,[]GEOSITE,category-ai-!cn

;----------------------------------------------------------------
; 七、国际电商平台
;   核心平台拆成独立组，便于不同平台/账号长期固定不同出口 IP。
;   Ecommerce_All 仍作为长尾与漏收域名兜底；必须排在独立平台之后。
;   ruleset 总数需控制在 subconverter 默认上限 64 以内，因此这里只给
;   Amazon 额外叠加 GEOSITE，其它核心平台使用各自完整清单。
;----------------------------------------------------------------
ruleset=Amazon,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/Custom_OpenClash_Rules@633657074d243f6869c1c3978eb64b2305dfe097/rule/openclash/Amazon.list,86400
ruleset=Amazon,[]GEOSITE,amazon
ruleset=Temu,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Temu.list,86400
ruleset=SHEIN,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Shein.list,86400
ruleset=eBay,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/eBay.list,86400
ruleset=AliExpress,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/AliExpress.list,86400
ruleset=Shopify,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Shopify.list,86400
ruleset=其他国际电商,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/Custom_OpenClash_Rules@633657074d243f6869c1c3978eb64b2305dfe097/rule/openclash/Ecommerce_All.list,86400
ruleset=其他国际电商,[]GEOSITE,category-ecommerce

;----------------------------------------------------------------
; 七之二、国际快递 / 物流 / 海关税务
;   DHL/FedEx/UPS/USPS/各国邮政/17TRACK/跨境物流商/CBP/HMRC 等
;----------------------------------------------------------------
ruleset=物流快递,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Logistics_All.list,86400
ruleset=物流快递,[]GEOSITE,jtexpress

;----------------------------------------------------------------
; 八、流媒体（YouTube 必须在谷歌服务之前，否则被 geosite:google 抢走）
;----------------------------------------------------------------
ruleset=流媒体,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Stream_All.list,86400
ruleset=流媒体,[]GEOSITE,youtube
ruleset=流媒体,[]GEOSITE,netflix

;----------------------------------------------------------------
; 八之二、人机验证 / 风控反欺诈 / 身份认证
;   必须排在各平台之后：平台自有验证端点（如 OpenAI 的 arkose）
;   跟随各自平台节点；此处只接管通用验证（Cloudflare Turnstile /
;   hCaptcha / DataDome / PerimeterX / 设备指纹 / 短信验证码等）
;   ⚠️ 建议把本组设为与当前操作账号相同的节点，避免验证 IP 与账号 IP 不一致
;----------------------------------------------------------------
ruleset=验证服务,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Verify_All.list,86400
ruleset=验证服务,[]GEOSITE,cloudflare
ruleset=验证服务,[]GEOSITE,hcaptcha

;----------------------------------------------------------------
; 九、谷歌 / GitHub / 大厂服务
;----------------------------------------------------------------
ruleset=谷歌服务,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Google.list,86400
ruleset=谷歌服务,[]GEOSITE,google
ruleset=GitHub,[]GEOSITE,github
ruleset=全球直连,[]GEOSITE,apple
ruleset=全球直连,[]GEOSITE,microsoft


;----------------------------------------------------------------
; 十、境外兜底（抓走全部剩余境外域名，绝不漏到直连）
;----------------------------------------------------------------
; 注：不引用 Global.list（3.2 万条，与 geolocation-!cn 完全重复且会撑爆
;     subconverter 规则上限导致模板被拒）。geolocation-!cn 由内核解析，
;     一行即可覆盖全部境外域名，效率更高。
ruleset=节点选择,[]GEOSITE,geolocation-!cn

;----------------------------------------------------------------
; 十一、国内兜底
;----------------------------------------------------------------
ruleset=全球直连,[]GEOSITE,cn
ruleset=全球直连,[]GEOIP,cn,no-resolve

;----------------------------------------------------------------
; 十二、非标端口 + FINAL（漏网之鱼走代理，不直连）
;----------------------------------------------------------------
ruleset=非标端口,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,86400
ruleset=漏网之鱼,[]FINAL

;==================================================================
; 策略组定义
;   [] 引用其它分组；.* 表示导入全部节点
;   平台组用 select 手动钉节点（防关联：一账号一固定 IP）
;==================================================================

;-------- 顶层 --------
custom_proxy_group=节点选择`select`[]自动选择`.*
; 自动选择：排除专线/中转节点（它们用于链式代理，不参与直连测速）
custom_proxy_group=自动选择`url-test`(?i)^(?!.*(专线|中转|IPLC|IEPL|fast|SX|ou0|ou1|premium|relay)).*$`http://www.gstatic.com/generate_204`300,,50
; 中转选择：链式代理(dialer-proxy)入口，不出现在任何可选组里
custom_proxy_group=中转选择`select`[]节点选择`[]自动选择`[]专线中转`[]专线自动选择
; 专线中转：留空占位，自行加入中转/加速 IP
custom_proxy_group=专线中转`select`[]DIRECT
; 专线自动选择：中转节点自动测速容灾
custom_proxy_group=专线自动选择`url-test`(?i)(专线|中转|IPLC|IEPL|fast|SX|ou0|ou1|relay)`http://www.gstatic.com/generate_204`300,,50

;-------- 社媒平台（每个账号钉一个固定节点）--------
custom_proxy_group=Facebook`select`[]节点选择`[]自动选择`.*
custom_proxy_group=Instagram`select`[]节点选择`[]自动选择`.*
custom_proxy_group=WhatsApp`select`[]节点选择`[]自动选择`.*
custom_proxy_group=Twitter`select`[]节点选择`[]自动选择`.*
custom_proxy_group=TikTok`select`[]节点选择`[]自动选择`.*
custom_proxy_group=Telegram`select`[]节点选择`[]自动选择`.*
custom_proxy_group=社交媒体`select`[]节点选择`[]自动选择`.*

;-------- 电商 / 支付 / AI --------
custom_proxy_group=Amazon`select`[]节点选择`[]自动选择`.*
custom_proxy_group=Temu`select`[]节点选择`[]自动选择`.*
custom_proxy_group=SHEIN`select`[]节点选择`[]自动选择`.*
custom_proxy_group=eBay`select`[]节点选择`[]自动选择`.*
custom_proxy_group=AliExpress`select`[]节点选择`[]自动选择`.*
custom_proxy_group=Shopify`select`[]节点选择`[]自动选择`.*
custom_proxy_group=其他国际电商`select`[]节点选择`[]自动选择`.*
custom_proxy_group=支付平台`select`[]节点选择`[]自动选择`.*
custom_proxy_group=AI服务`select`[]节点选择`[]自动选择`.*
custom_proxy_group=物流快递`select`[]节点选择`[]自动选择`.*
custom_proxy_group=验证服务`select`[]节点选择`[]自动选择`.*

;-------- 其它 --------
custom_proxy_group=流媒体`select`[]节点选择`[]自动选择`.*
custom_proxy_group=谷歌服务`select`[]节点选择`[]自动选择`.*
custom_proxy_group=GitHub`select`[]节点选择`[]自动选择`.*

;-------- 非标端口（80/443 之外，部分节点不支持）--------
custom_proxy_group=非标端口`select`[]节点选择`[]全球直连`[]自动选择`.*

;-------- WebRTC / 直连 / 兜底 --------
custom_proxy_group=WebRTC`select`[]REJECT`[]节点选择`[]全球直连
custom_proxy_group=全球直连`select`[]DIRECT`[]节点选择
custom_proxy_group=漏网之鱼`select`[]节点选择`[]自动选择`[]全球直连`.*
