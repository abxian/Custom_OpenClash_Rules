;==================================================================
; 跨境电商 · 防泄漏 / 防关联 订阅转换模板 (subconverter / OpenClash)
; 作者仓库：https://github.com/abxian/Custom_OpenClash_Rules
; 平台分流规则：https://github.com/abxian/stash-override  (rule/*.list)
; 设计目标：
;   1) 防 DNS / IPv6 / WebRTC 泄漏（配合 config.yaml 的 fake-ip + sniffer）
;   2) 各社媒/电商/AI 平台独立分组，可为每个账号钉死固定节点（防关联）
;   3) FINAL(漏网之鱼) 走代理而非直连，杜绝“漏网”导致的真实 IP 泄漏
; 说明：规则自上而下匹配，命中即停；调整顺序会改变分流结果
;==================================================================

[custom]
enable_rule_generator=true
overwrite_original_rules=true

;----------------------------------------------------------------
; 一、直连兜底（局域网 / 路由器 / 国内直连域名）
;----------------------------------------------------------------
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,lan
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,local

;----------------------------------------------------------------
; 二、广告 / 追踪拦截（对防关联有利：切断第三方指纹/埋点回传）
;----------------------------------------------------------------
ruleset=🛑 广告拦截,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/ADLite.list,86400
ruleset=🛑 广告拦截,[]GEOSITE,category-ads-all

;----------------------------------------------------------------
; 三、防 WebRTC 泄漏（拦截 STUN，阻止浏览器探测真实公网 IP）
;----------------------------------------------------------------
ruleset=🎥 WebRTC,[]DOMAIN-KEYWORD,stun
ruleset=🎥 WebRTC,[]DOMAIN-SUFFIX,stun.l.google.com

;----------------------------------------------------------------
; 四、社媒平台分流（每个平台独立组，可为不同账号固定不同节点）
;----------------------------------------------------------------
ruleset=📘 Facebook,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Facebook.list,86400
ruleset=📷 Instagram,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Instagram.list,86400
ruleset=🐦 Twitter,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Twitter.list,86400
ruleset=🎵 TikTok,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/TikTok.list,86400
ruleset=📲 Telegram,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Telegram.list,86400
ruleset=📲 Telegram,[]GEOIP,telegram,no-resolve

;----------------------------------------------------------------
; 五、AI 服务（ChatGPT / Claude / Gemini / Copilot 等）
;----------------------------------------------------------------
ruleset=🤖 AI服务,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/OpenAI.list,86400
ruleset=🤖 AI服务,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Claude.list,86400
ruleset=🤖 AI服务,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Gemini.list,86400
ruleset=🤖 AI服务,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Copilot.list,86400
ruleset=🤖 AI服务,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/ai.list,86400

;----------------------------------------------------------------
; 六、国际电商平台（Amazon / eBay / Shopify / PayPal / Stripe ...）
;   → 走“🛒 国际电商”固定节点，保证账号 IP 稳定，避免风控关联
;----------------------------------------------------------------
ruleset=🛒 国际电商,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Amazon.list,86400
ruleset=🛒 国际电商,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/eBay.list,86400
ruleset=🛒 国际电商,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Shopify.list,86400
ruleset=🛒 国际电商,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/PayPal.list,86400
ruleset=🛒 国际电商,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Stripe.list,86400
ruleset=🛒 国际电商,[]GEOSITE,category-ecommerce

;----------------------------------------------------------------
; 七、流媒体 / 大厂服务
;----------------------------------------------------------------
ruleset=🎥 流媒体,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/YouTube.list,86400
ruleset=🎥 流媒体,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Netflix.list,86400
ruleset=🎥 流媒体,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Disney.list,86400
ruleset=🎥 流媒体,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Spotify.list,86400
ruleset=🎥 流媒体,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/GlobalMedia.list,86400
ruleset=🍎 苹果服务,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Apple.list,86400
ruleset=Ⓜ️ 微软服务,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Microsoft.list,86400
ruleset=🎮 Steam,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Steam.list,86400
ruleset=🇬 谷歌服务,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Google.list,86400

;----------------------------------------------------------------
; 八、境外兜底 + 国内兜底
;----------------------------------------------------------------
ruleset=🚀 手动选择,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/Global.list,86400
ruleset=🚀 手动选择,[]GEOSITE,gfw
; 国内域名/IP 兜底（放在境外规则之后，避免误伤海外服务）
ruleset=🎯 全球直连,clash-classic:https://testingcf.jsdelivr.net/gh/abxian/stash-override@master/rule/ChinaMax.list,86400
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve
; FINAL：漏网之鱼走代理（关键！直连会导致 DNS 泄漏测试失败/真实 IP 暴露）
ruleset=🐟 漏网之鱼,[]FINAL

;==================================================================
; 策略组定义
;   [] 引用其它分组；.* 表示导入全部节点
;   地区组用 url-test 自动测速；平台组用 select 手动钉节点（防关联）
;==================================================================

;-------- 顶层选择 --------
custom_proxy_group=🚀 手动选择`select`[]♻️ 自动选择`[]🔒 专线中转`[]🇭🇰 香港`[]🇼🇸 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇰🇷 韩国`[]🇺🇸 美国`[]🇬🇧 英国`[]🇩🇪 德国`[]🌐 其他地区`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🔒 专线中转`url-test`(专线|中转|IPLC|IEPL|iplc|iepl|fast|premium|Pro|SX|ou0|ou1)`http://www.gstatic.com/generate_204`300,,50

;-------- 平台分组（select：为每个账号固定一个节点，防关联）--------
custom_proxy_group=📘 Facebook`select`[]🚀 手动选择`[]🔒 专线中转`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🇯🇵 日本`[]🇭🇰 香港`[]♻️ 自动选择`.*
custom_proxy_group=📷 Instagram`select`[]🚀 手动选择`[]🔒 专线中转`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🇯🇵 日本`[]🇭🇰 香港`[]♻️ 自动选择`.*
custom_proxy_group=🐦 Twitter`select`[]🚀 手动选择`[]🔒 专线中转`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🇯🇵 日本`[]🇭🇰 香港`[]♻️ 自动选择`.*
custom_proxy_group=🎵 TikTok`select`[]🚀 手动选择`[]🔒 专线中转`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🇯🇵 日本`[]🇭🇰 香港`[]♻️ 自动选择`.*
custom_proxy_group=📲 Telegram`select`[]🚀 手动选择`[]🔒 专线中转`[]🇸🇬 新加坡`[]🇭🇰 香港`[]🇺🇸 美国`[]♻️ 自动选择`.*
custom_proxy_group=🤖 AI服务`select`[]🚀 手动选择`[]🇺🇸 美国`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🔒 专线中转`[]♻️ 自动选择`.*
custom_proxy_group=🛒 国际电商`select`[]🚀 手动选择`[]🔒 专线中转`[]🇺🇸 美国`[]🇬🇧 英国`[]🇩🇪 德国`[]🇯🇵 日本`[]🇸🇬 新加坡`[]♻️ 自动选择`.*
custom_proxy_group=🎥 流媒体`select`[]🚀 手动选择`[]🔒 专线中转`[]🇸🇬 新加坡`[]🇭🇰 香港`[]🇺🇸 美国`[]🇯🇵 日本`[]♻️ 自动选择`.*
custom_proxy_group=🇬 谷歌服务`select`[]🚀 手动选择`[]♻️ 自动选择`[]🔒 专线中转`.*
custom_proxy_group=🍎 苹果服务`select`[]🎯 全球直连`[]🚀 手动选择`[]♻️ 自动选择`.*
custom_proxy_group=Ⓜ️ 微软服务`select`[]🎯 全球直连`[]🚀 手动选择`[]♻️ 自动选择`.*
custom_proxy_group=🎮 Steam`select`[]🎯 全球直连`[]🚀 手动选择`[]♻️ 自动选择`.*

;-------- WebRTC / 直连 / 拦截 / 兜底 --------
custom_proxy_group=🎥 WebRTC`select`[]REJECT`[]🚀 手动选择`[]🎯 全球直连
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 手动选择
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 手动选择`[]♻️ 自动选择`[]🔒 专线中转`[]🎯 全球直连`.*

;-------- 地区自动测速组 --------
custom_proxy_group=🇭🇰 香港`url-test`(?i)(🇭🇰|香港|港|\bHK\b|HongKong|Hong Kong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇼🇸 台湾`url-test`(?i)(🇹🇼|台湾|台|\bTW\b|Taiwan)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本`url-test`(?i)(🇯🇵|日本|\bJP\b|Japan|东京|大阪)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡`url-test`(?i)(🇸🇬|新加坡|坡|狮城|\bSG\b|Singapore)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇰🇷 韩国`url-test`(?i)(🇰🇷|韩国|韩|\bKR\b|Korea|首尔)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国`url-test`(?i)(🇺🇸|美国|美|\bUS\b|United States|America)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇬🇧 英国`url-test`(?i)(🇬🇧|英国|英|\bUK\b|\bEN\b|United Kingdom|London)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇩🇪 德国`url-test`(?i)(🇩🇪|德国|德|\bDE\b|Germany)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🌐 其他地区`url-test`(?i)(迪拜|阿曼|瑞士|印度|\bIN\b|\bAU\b|Dubai|Oman)`http://www.gstatic.com/generate_204`300,,50

;==================================================================
; 生成 clash 配置时同时套用防泄漏基础参数（subconverter 会合并）
;==================================================================
enable_rule_generator=true
overwrite_original_rules=true
